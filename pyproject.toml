[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
py_version = 310

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=api --cov=app --cov=database --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
packages = ["api", "app", "database"]
